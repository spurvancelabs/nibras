name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint check  
        run: pnpm lint

      - name: Build application
        env:
          # Dummy values for build - Vercel will use real env vars
          MONGODB_URI: mongodb://localhost:27017/build-test
          AUTH_SECRET: build-time-dummy-secret-minimum-32-chars-required-for-nextauth-v4
          AUTH_URL: http://localhost:3000
          RESEND_API_KEY: dummy-key-for-build-process
          RESEND_FROM: "Test <test@example.com>"
          CLOUDINARY_CLOUD_NAME: dummy-cloud-name
          CLOUDINARY_API_KEY: dummy-api-key
          CLOUDINARY_API_SECRET: dummy-api-secret
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dummy-cloud-name
          NEXT_PUBLIC_CLOUDINARY_PRESET: dummy-preset-name
          CRON_SECRET: dummy-cron-secret-key
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Check build output
        run: |
          ls -la .next/ || echo "Build output not found"
          echo "✅ Build completed successfully"

  # Deploy confirmation (Vercel handles actual deployment via Git integration)
  deploy-ready:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Deployment Ready
        run: |
          echo "🚀 All checks passed!"
          echo "✅ TypeScript compilation successful"
          echo "✅ Linting passed"  
          echo "✅ Production build completed"
          echo ""
          echo "Vercel will automatically deploy this commit to production."