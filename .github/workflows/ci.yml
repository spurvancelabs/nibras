name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint check  
        run: pnpm lint

      - name: Build application
        env:
          # Dummy values for build - Vercel will use real env vars
          MONGODB_URI: mongodb://localhost:27017/build-test
          AUTH_SECRET: build-time-dummy-secret-minimum-32-chars-required-for-nextauth
          AUTH_URL: http://localhost:3000
          RESEND_API_KEY: dummy-key
          RESEND_FROM: "Test <test@example.com>"
          CLOUDINARY_CLOUD_NAME: dummy-cloud
          CLOUDINARY_API_KEY: dummy-key
          CLOUDINARY_API_SECRET: dummy-secret
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dummy-cloud
          NEXT_PUBLIC_CLOUDINARY_PRESET: dummy-preset
          CRON_SECRET: dummy-cron-secret
          NODE_ENV: production
        run: pnpm build

      - name: Check build output
        run: |
          ls -la .next/
          echo "Build completed successfully"

  # Deploy job that runs after successful build (only on main branch)
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Deploy to Vercel
        run: |
          echo "🚀 Deployment will be handled by Vercel's Git integration"
          echo "✅ All checks passed - ready for production deployment"